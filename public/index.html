<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地天氣站 · Local Weather Station</title>
<meta name="description" content="Local single-page weather dashboard backed by the Hong Kong Observatory Open Data API.">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/icons/pic54.png">
</head>
<body>

<a class="skip" href="#main">跳至主要內容</a>

<!-- ================= masthead ================= -->
<header class="masthead">
  <div class="masthead__row">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">
        <strong data-i18n="siteTitle">本地天氣站</strong>
        <small data-i18n="siteSub">資料來源：香港天文台開放數據</small>
      </span>
    </div>

    <div class="masthead__right">
      <div class="datetime" id="dateStrip">
        <span id="dateGregorian">—</span><span class="datetime__sep">|</span><span id="dateLunar">—</span>
      </div>

      <div class="toolbar">
        <button type="button" class="navbar-menu" id="btnFont" data-i18n="tbFont" title="文字大小">文字大小</button>
        <button type="button" class="navbar-menu" id="btnShare" data-i18n="tbShare" title="分享">分享</button>
        <button type="button" class="navbar-menu" id="btnSearch" data-i18n="tbSearch" title="搜尋">搜尋</button>
        <button type="button" class="navbar-menu" id="btnMenu" data-i18n="tbMenu" title="選單" aria-expanded="true">選單</button>

        <nav class="langs" aria-label="Language">
          <button type="button" data-lang="tc" class="lang is-active">繁</button>
          <button type="button" data-lang="sc" class="lang">简</button>
          <button type="button" data-lang="en" class="lang">EN</button>
        </nav>
      </div>
    </div>
  </div>

  <form class="search" id="stationSearch" role="search" autocomplete="off" hidden>
    <input type="search" id="searchInput" placeholder="搜尋地點…" aria-label="搜尋地點" data-i18n-ph="searchPh">
    <button type="submit" aria-label="搜尋">🔍</button>
  </form>
</header>

<!-- ================= top-level section nav ================= -->
<nav class="hkonav" aria-label="Sections">
  <div class="hkonav__inner">
    <a href="https://www.hko.gov.hk/tc/wxinfo/currwx/current.htm" target="_blank" rel="noopener" data-i18n="navWeather">天氣</a>
    <a href="https://www.hko.gov.hk/tc/cis/climahk.htm" target="_blank" rel="noopener" data-i18n="navClimate">氣候</a>
    <a href="https://www.hko.gov.hk/tc/gts/eqinfo.htm" target="_blank" rel="noopener" data-i18n="navGeo">地球物理</a>
    <a href="https://www.hko.gov.hk/tc/gts/time.htm" target="_blank" rel="noopener" data-i18n="navAstro">天文及授時</a>
    <a href="https://www.hko.gov.hk/tc/radiation/real_time.htm" target="_blank" rel="noopener" data-i18n="navRad">輻射監測</a>
    <a href="https://www.hko.gov.hk/tc/community/community_uc.htm" target="_blank" rel="noopener" data-i18n="navCommunity">社群</a>
    <a href="https://www.hko.gov.hk/tc/education/edu.htm" target="_blank" rel="noopener" data-i18n="navLearn">學習</a>
    <a href="https://www.hko.gov.hk/tc/whatsnew/index.htm" target="_blank" rel="noopener" data-i18n="navMedia">媒體及消息</a>
    <a href="https://www.hko.gov.hk/tc/aboutus/aboutus.htm" target="_blank" rel="noopener" data-i18n="navAbout">關於我們</a>
  </div>
</nav>

<div id="warningBar" class="warnbar" hidden></div>

<!-- ================= body: sidebar + content ================= -->
<div class="layout" id="layout">

  <aside class="side" id="sideNav" aria-label="天氣資訊導覽"></aside>

  <main id="main" class="main">
    <div id="statusStrip" class="strip">
      <span id="statusDot" class="dot dot--idle"></span>
      <span id="statusText">載入中…</span>
      <button id="refreshBtn" class="btn" type="button" data-i18n="refresh">即時更新</button>
    </div>

    <section id="view" class="view" aria-live="polite"></section>
  </main>

</div>

<!-- ================= footer ================= -->
<footer class="foot">
  <div class="foot__inner">
    <ul class="foot__links">
      <li><a href="https://www.hko.gov.hk/tc/cis/climahk.htm" target="_blank" rel="noopener" data-i18n="fClimate">香港氣候</a></li>
      <li><a href="https://www.hko.gov.hk/tc/wxinfo/pastwx/mws.htm" target="_blank" rel="noopener" data-i18n="fSummary">每月天氣摘要</a></li>
      <li><a href="https://www.hko.gov.hk/tc/whatsnew/index.htm" target="_blank" rel="noopener" data-i18n="fNew">新增項目</a></li>
      <li><a href="https://www.hko.gov.hk/tc/abouthko/opendata_intro.htm" target="_blank" rel="noopener" data-i18n="fOpen">公開資料</a></li>
      <li><a href="https://www.hko.gov.hk/tc/abouthko/related.htm" target="_blank" rel="noopener" data-i18n="fRelated">相關網址</a></li>
      <li><a href="https://www.hko.gov.hk/tc/abouthko/userguide.htm" target="_blank" rel="noopener" data-i18n="fGuide">快速用戶指南</a></li>
      <li><a href="https://www.hko.gov.hk/tc/cont.htm" target="_blank" rel="noopener" data-i18n="fContact">聯絡我們</a></li>
      <li><a href="https://www.hko.gov.hk/tc/important_notice.htm" target="_blank" rel="noopener" data-i18n="fNotice">重要告示</a></li>
      <li><a href="https://www.hko.gov.hk/tc/privacy.htm" target="_blank" rel="noopener" data-i18n="fPrivacy">私隱政策</a></li>
    </ul>
    <p data-i18n="footNote">本機示範應用。天氣資料由香港天文台開放數據 API 提供，版權屬香港天文台所有。此介面為獨立實作，並非天文台官方網站。</p>
    <p class="foot__meta"><span id="footMeta">—</span></p>
  </div>
</footer>

<script src="/app.js"></script>
</body>
</html>
